# LightRAG — 本檔是 SSOT，部署時複製到 Dockge 的 stack 目錄
#
# ## 這個檔怎麼上線
#
# repo 是唯一真相，`/opt/stacks/lightrag/compose.yaml` 是它的副本。
# 模式與 `deploy/systemd/*.service` → `/etc/systemd/system/` 完全相同
# （`systemd-units.py install`），維護的人只要理解一次。
#
# ⚠ **`/opt/stacks/lightrag/` 必須是真目錄，絕不可以是指向 repo 的 bind mount。**
#   2026-08-07 之前 dockge 的 compose 有一條
#     - /home/florian/ghq/github.com/neknufelet/lightrag:/opt/stacks/lightrag
#   把 repo 掛進 Dockge 容器。宿主上那是個空目錄（不同 inode），但**容器裡看到的
#   是 repo 本身**，於是 Dockge UI 的「刪除」按鈕會刪掉 repo ——包含 dker 上唯一的
#   `.env`。那條掛載已移除，不要恢復。
#
# ⚠ 也**不要**把 stack 目錄的 compose.yaml 做成指回 repo 的 symlink：Dockge UI
#   可以編輯 compose，寫下去就是改到 dker 的 checkout，下次 `git pull --ff-only`
#   直接失敗（dker 的 repo 是唯讀，只 pull）。
#
# ⚠ Dockge 自己的設定在 dker 的 /opt/stacks/dockge/compose.yaml，**不在版控**
#   （備份：同目錄的 compose.yaml.bak-20260807）。重建 dker 時要記得它。
#
# 單一實例：靠 .env 的 WORKSPACE 切換知識庫。要同時跑第二個知識庫時，
# 複製本目錄為另一個 stack，改 WORKSPACE 與 HOST_PORT 即可 —— 儲存層
# 已用 workspace 隔離，兩者可共存於同一組 Postgres。
#
# 注意：compose 的 ${VAR} 插值讀的是本目錄的 .env（與 env_file 同一份），
# 所以 WORKSPACE / HOST_PORT 改一處即同時生效於容器名、port 與資料路徑。

# 容器名用 ${WORKSPACE:?…} 強制插值：沒設就整個 compose 指令失敗。
#
# 為什麼要強制：容器名決定所有工具 `docker exec` 進哪裡。一個猜錯的預設
# （這裡曾是 `${WORKSPACE:-acoustics_v155}`）**不會報錯**，只會安靜地對
# 另一個庫做事。看得見的壞 > 安靜的錯。
#
# ⚠ **代價（2026-08-03 sol 終審實測，Compose v5.1.4）**：`:?` 在讀取
# compose model 時就擋下，所以 `.env` 消失且 shell 沒有 WORKSPACE 時，
# config / up / down / ps **全部** exit 1 —— 包含 **`down`**。也就是說
# 「連停都停不掉」。逃生方式：
#
#     WORKSPACE=acoustics_v2 docker compose down
#
# 這是刻意接受的取捨：緊急停機多打一個前綴，換掉「安靜連到錯的庫」。
# 但別假裝沒有這個代價 —— 真的遇到時要知道逃生指令長什麼樣。
services:
  lightrag:
    # 用 digest 而非 tag 釘死。標籤是可以被重推的 —— 作者修完 bug 常用同一個 v1.5.5
    # 再推一次，於是 compose 一個字沒改、拉到的卻是不同映像。我們整套後處理都建立在
    # 「LightRAG 如何讀寫 __parsed__ 底下的檔案」這些假設上，環境默默變動會讓假設失效
    # 而無人察覺。釘 digest 後升級變成一個明確的動作（改這一行），而非某次重啟的副作用。
    # 對應 v1.5.6（2026-08-07 換上，前值 206579ab… 是 v1.5.5，已在 dker 逐字元核對）。
    # 升級時用 docker image inspect --format '{{.RepoDigests}}' 取新值。
    #
    # ⚠ **不 fork、不 build 自己的映像。** 官方映像原封不動拉下來，我們要的額外
    # 功能一律「插在旁邊」——見下面的 kbapi：官方 python:3.12-slim ＋ 把 ./scripts
    # 掛進去 ＋ 一行 command。這樣升級只是換這一行 digest，沒有「我們的 patch
    # 要 rebase」這件事。
    image: ghcr.io/hkuds/lightrag@sha256:ab23a9c83a735901b18c8960b6b482b602d5b6291abb7e07c5776f7bb2da504e
    container_name: lightrag-${WORKSPACE:?WORKSPACE 未設定}
    restart: unless-stopped

    env_file: .env

    # 只綁 Tailscale 位址，不對外。要改成本機才可存取就設 BIND_ADDR=127.0.0.1
    ports:
      - "${BIND_ADDR:-100.87.88.7}:${HOST_PORT:-9621}:9621"

    volumes:
      # 執行期資料放 /data 的獨立 NVMe，不進 repo
      #
      # ⚠ **同一台跑第二個 workspace 時，這個必須分開。** 裡面是 scan_spool
      #   （掃描佇列），兩個實例共用會讓一邊撿到另一邊的掃描工作 —— 而且不會
      #   報錯，只會是「文件進到錯的庫」。用 RAG_STORAGE_DIR 覆寫即可；
      #   預設維持原路徑，所以既有的 stack 不受影響。
      #   （inputs 不必特別處理：容器會在其下建 inputs/<workspace>，天然分開。）
      - ${RAG_STORAGE_DIR:-${DATA_ROOT:-/data/lightrag}/rag_storage}:/app/data/rag_storage
      # inputs 必須可寫 —— LightRAG 啟動時會在其下建立 ${WORKSPACE} 子目錄。
      # 宿主因此保留 inputs/<workspace> 這一層；檔案經 WebUI／API 上傳，或見 README
      # 的批次匯入。只掛 inputs 根層，才能讓 LightRAG 建出它實際會掃的子目錄。
      - ${INPUTS_DIR:-${DATA_ROOT:-/data/lightrag}/inputs}:/app/data/inputs
      # LightRAG 的 archive_source 仍只認容器內的 __parsed__；把這個子 mount
      # 導到獨立工作區，宿主就不會把解析快取混在索引入口裡。
      - ${DATA_ROOT:-/data/lightrag}/work/parsed:/app/data/inputs/${WORKSPACE}/__parsed__

    networks:
      - rag

    # 映像檔內沒有 curl／wget，只能用 python
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - |
          import os, urllib.request as u
          u.urlopen(u.Request("http://localhost:9621/health",
                    headers={"X-API-Key": os.environ["LIGHTRAG_API_KEY"]}), timeout=5)
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # LightRAG 沒有圖片端點，1,786 張圖躺在 __parsed__/*/images/ 但 API 拿不到。
  # 這支唯讀服務把它們開出來，另外提供單篇的結構化內容。
  # 只用 Python 標準函式庫，所以直接掛官方 slim 映像跑腳本，不需要自己建映像。
  # 綁 0.0.0.0：容器內沒有 Tailscale 介面，隔離靠的是 ports 只發佈到
  # ${BIND_ADDR}，跟 lightrag 一致。
  kbapi:
    image: python:3.12-slim
    container_name: kbapi-${WORKSPACE:?WORKSPACE 未設定}
    restart: unless-stopped
    # 宿主埠走 ${KBAPI_PORT}，容器內恆為 9700（與 lightrag 的 ${HOST_PORT}:9621 同形）。
    #
    # 以下是歷史紀錄：REBUILD 期間本服務曾以 `profiles: ["kbapi"]` 停用，理由是
    # 9700 寫死、會撞到凍結中的 kbapi-acoustics_v155。但 profile 是**寫在檔案裡**的，
    # 而 compose.yaml 進版控、被兩個 checkout 共用 —— 分支一合併回主線，主線的
    # checkout 也會拿到那一行，下次 `docker compose up -d` 就不會起 kbapi，:9700
    # 靜靜消失、三個 skill 一起啞掉且不報錯。埠參數化把「哪個 checkout 用哪個埠」
    # 移到各自的 .env（不進版控），檔案本身對兩邊都正確。
    #
    # 容器名是 kbapi-${WORKSPACE}，兩個 workspace 不同名，只有埠需要錯開。
    # CUTOVER 時 v155 的 kbapi 退役、9700 空出來，把新庫 .env 的 KBAPI_PORT 改成
    # 9700 即可，compose.yaml 一個字都不用動。
    command: ["python", "/app/scripts/kbapi.py", "--port", "9700"]
    working_dir: /app
    environment:
      PP_DATA_ROOT: /data/lightrag
    volumes:
      # ⚠ 不能用 `./scripts` —— 相對路徑是相對於 compose.yaml 所在目錄，而本檔
      # 部署時會被複製到 /opt/stacks/lightrag/（見檔頭）。那裡沒有 scripts/。
      # REPO_DIR 用 `:?` 強制設定，理由與 WORKSPACE 相同：猜錯的預設比失敗更糟。
      - ${REPO_DIR:?REPO_DIR 未設定 —— 指向 repo checkout，kbapi 要從那裡讀 scripts}/scripts:/app/scripts:ro
      # 這個 `.env` 是與 compose.yaml 同目錄的那份（stack 目錄），不是 repo 裡的。
      - ./.env:/app/.env:ro
      - ${DATA_ROOT:-/data/lightrag}:/data/lightrag:ro
    ports:
      - "${BIND_ADDR:-100.87.88.7}:${KBAPI_PORT:-9700}:9700"
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request as u; u.urlopen('http://localhost:9700/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - rag

  # 收件匣／審核台：只用標準函式庫，直接以官方 Python slim 執行。
  # DATA_ROOT 必須可寫，因為 intake 會建立 library、work、inputs 與 intake 狀態；
  # 來源庫是別人的語料，只讀掛載，避免審核台誤寫來源。
  # ── 審核台（:9710）**不在這裡** ────────────────────────────────────────
  #
  # 這裡原本有一份 intake 服務宣告，從落地到 2026-08-04 從來沒被啟用過 ——
  # 實際跑的一直是宿主上的行程。理由寫在這裡，免得下一個人再試一次：
  #
  #   審核台會呼叫 postprocess.py，而 pp/oracle.py 靠 `docker exec` 進 LightRAG
  #   容器問它的真實行為（鐵則 3）。容器裡要做這件事就得掛 /var/run/docker.sock，
  #   而審核台是**對外開埠、接受檔案上傳**的網頁服務 —— 給它 docker socket
  #   等於誰打進來誰就有整台機器。這個交換划不來。
  #
  # 那份宣告還有兩個實質錯誤，留著就是陷阱：缺 `--source`（收件匣掃不到、
  # 畫面永遠空的），以及掛著 DeepTutor 時代的 /data/rag/knowledge_bases。
  # 有人 `docker compose up` 就會起一個搶 9710 埠的壞掉版本。
  #
  # 真正要解決的是「重開機會不會自己回來」，那是 systemd 的事：
  # `deploy/systemd/lightrag-intake.service`，用
  # `sudo scripts/systemd-units.py install` 安裝，daily-check 每天比對它還在不在。

  # ── 自己的儲存後端（2026-08-03 從 DeepTutor 的實例搬出來）──────────────
  #
  # 為什麼要搬：原本我們的資料寄住在 deeptutor-v4-postgres 與 deeptutor-v4-neo4j，
  # 靠 Postgres 的 workspace 欄位與 Neo4j 的 label 與別人的資料分開。那個安排讓
  # **同一族的 bug 咬過三次**，而且每一次都不報錯：
  #   ① extract-check.py 三句 SQL 漏 workspace 條件 → 兩個庫的同一份文件被併成
  #      一列，數字看起來完全正常（約兩倍），翻轉了三份文件的閘門判定
  #   ② CLAUDE.md 記載的關係數 20,873 —— 上面那個 bug 的殘留，活過了修它的修復
  #   ③ kbapi 的 search 不看 URL 的 workspace → 靜靜回別的庫的答案
  # 有了自己的實例，「查到別的庫」在結構上不可能 —— 因為沒有別的庫。
  #
  # 附帶好處：備份從「怎麼只挑出我們那 688 MB」變成「抄 /data/lightrag 一個目錄」。
  # 共用時做不到這件事：Postgres 的 base/<oid> 雖然一庫一目錄，但 global／pg_xact／
  # pg_wal 是全叢集共用的，只抄我們那個目錄還原不回來（沒有 global 就不知道那個
  # 目錄是哪個庫；pg_xact 對不上會讓資料列被判成「交易沒成功」而憑空消失）。
  #
  # 兩個都**不對外開埠**：同在 rag_default 網路上，用容器名互連就好，
  # 少一個對外攻擊面、也不會跟既有的埠打架。
  postgres:
    image: pgvector/pgvector:pg16          # 與原實例同版：PG 16.14 + pgvector 0.8.2
    container_name: lightrag-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DATABASE}
      TZ: Asia/Taipei
    volumes:
      - ${LIGHTRAG_DB_ROOT:-/data/lightrag}/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DATABASE}"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - rag

  # 本地 embedding + rerank（2026-08-08 新增）。
  #
  # **為什麼放 dker**：這台有一張 RTX 2070 8 GB，實測 `nvidia-smi` 顯示用量 1 MiB
  # ——完全閒置。coder 那兩張 3060 已被 llama 佔滿（合計只剩 2.4 GB），放不下。
  # ⚠ CLAUDE.md 說 dker 的 `nvidia-smi` 是 driver/library mismatch，**那條已過期**
  #   （2026-08-08 實測 driver 595.84 / CUDA 13.2 正常，`lspci` 確認 TU106M）。
  #
  # **為什麼是 Infinity**：一個容器同時供 embedding 與 rerank，兩邊都講標準形狀
  # ——`/embeddings` 是 OpenAI 相容、`/rerank` 是 Cohere 相容。LightRAG 的 embedding
  # 接法沒有 infinity 這個選項，但可以用 `openai` 把 host 指過來（跟 LLM 接
  # llama.cpp 完全同一招）；rerank 則用 `cohere`。
  #
  # ⚠ **路徑沒有 `/v1` 前綴**（2026-08-08 實測踩到）。照 OpenAI 的習慣寫
  #   `/v1/embeddings` 會回 `{"detail":"Not Found"}`。問服務本人才知道：
  #     $ curl -s http://100.87.88.7:7997/openapi.json
  #       /embeddings [POST]　/rerank [POST]　/models [GET]　/health [GET]
  #   所以 `EMBEDDING_BINDING_HOST` 填到 `:7997` 為止，OpenAI SDK 會自己接
  #   `/embeddings`；`RERANK_BINDING_HOST` 則要**完整含 `/rerank`**
  #   （cohere_rerank 的 base_url 預設就是 https://api.cohere.com/v2/rerank）。
  #
  # **模型**（皆開源，授權已查證）：
  #   BAAI/bge-m3              embedding，5.68 億參數，1024 維，MIT
  #   BAAI/bge-reranker-v2-m3  rerank，5.68 億參數，Apache 2.0
  # 兩個都支援 100+ 語言與跨語言檢索 —— PO 用中文問、論文是英文的，這是必要條件。
  #
  # **1024 維夠不夠**：文獻上的共識是「該選還能維持檢索品質的最小維度」，
  # 而多份 2026 年的整理認為 64–300 維就足以支撐語意召回，尤其在**有 rerank 層**
  # 的時候。OpenAI 自己的 3-large 也支援截斷到 1024（MRL），作者會出貨截斷功能
  # 就是因為尾巴那些維度帶的資訊很少。所以 1024 遠高於必要，不是「三分之一的品質」。
  #
  # ⚠ **Qwen3-Reranker 換不上去**（2026-08-08 實測）。官方映像 0.0.76 與 0.0.77
  #   內建的都是 transformers 4.49，不認得 `qwen3` 架構：
  #     ValueError: checkpoint has model type `qwen3` but Transformers does not
  #     recognize this architecture.
  #   跟模型大小無關，0.6B 也一樣卡住。要換得自建映像（違反本檔「不 fork 映像」
  #   的規矩）或改用 vLLM。已記進 NEXT.md 的暫緩區，等上游更新。
  #   **這是「支援」與「這個版本支援」的差別** —— 官方 README 確實有 Qwen3 範例。
  infinity:
    # 同 lightrag：釘 digest 不釘 tag。對應 v0.0.76（2026-08-08 在 dker 拉下、
    # 用 docker image inspect --format '{{.RepoDigests}}' 取值）。映像 7.55 GB。
    image: michaelf34/infinity@sha256:90bd83ecfb9922e9fdceec906cfb79863ad8aeaa45b15b950266679c3e2efd24
    container_name: lightrag-infinity
    restart: unless-stopped

    # 只綁 Tailscale 位址，跟其他服務一致
    ports:
      - "${BIND_ADDR:-100.87.88.7}:${INFINITY_PORT:-7997}:7997"

    volumes:
      # 模型權重快取。不放進 repo，也不放資料根的備份範圍 —— 它隨時可從
      # HuggingFace 重新下載，是**可再生**的，備份它只是浪費空間。
      - ${DATA_ROOT:-/data/lightrag}/models:/app/.cache/huggingface

    environment:
      - HF_HOME=/app/.cache/huggingface
      # 碎片化時讓 PyTorch 自己擴張分段，而不是直接 OOM
      - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True

    # 兩個模型同時載入，各自用自己的名字被呼叫。
    #
    # --device cuda 是明確指定 —— 讓「沒吃到 GPU」變成啟動失敗，
    # 而不是安靜地掉回 CPU 然後每次查詢慢十倍卻沒人發現。
    #
    # ⚠ **--dtype float16 不是可選的，是必須的**（2026-08-08 實測踩到）。
    #   Infinity 預設 float32，兩個 5.68 億參數的模型光權重就約 4.6 GB，
    #   加上 warmup 的中間張量直接 CUDA OOM、容器進重啟迴圈：
    #     torch.OutOfMemoryError: Tried to allocate 1.02 GiB.
    #     GPU 0 has a total capacity of 7.60 GiB of which 644.38 MiB is free.
    #   **權重大小不等於顯存需求**：吃記憶體的大宗是 batch × 序列長度的
    #   中間張量。估「模型才 2.5 GB，8 GB 綽綽有餘」是錯的。
    #
    # --batch-size 8：預設 32。實際用量是 rerank 一次 20–70 筆候選、
    #   embedding 查詢時 1 筆進料時成批 —— 8 已經足夠，而 batch 直接乘進中間張量。
    #
    # ⚠ **多值參數是按位置對應 model-id 的**（Infinity 的規則：單一值會廣播到
    #   所有模型，多個值則逐一對應）。這裡兩個模型都用 float16／batch 8，
    #   所以各給一個值讓它廣播即可 —— 要分別設定時，順序必須跟 model-id 一致。
    command: >
      v2
      --model-id BAAI/bge-m3
      --model-id BAAI/bge-reranker-v2-m3
      --dtype float16
      --batch-size 8
      --port 7997
      --device cuda

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

    networks:
      - rag

    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:7997/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      # 第一次啟動要下載兩個模型（約 2.5 GB），給足時間
      start_period: 600s

# Neo4j 服務已於 2026-08-07 移除。四種儲存全部在 Postgres 上：KV／DocStatus／
# Vector 早就是，Graph 換成 PGTableGraphStorage（v1.5.6 引進，不需要 Apache AGE）。
#
# 驗證方式是問映像本人，不是讀發布說明：
#   docker run --rm --entrypoint sh ghcr.io/hkuds/lightrag:v1.5.6 -c \
#     'python -c "from lightrag.kg import STORAGE_IMPLEMENTATIONS as S; \
#                 print(S[\"GRAPH_STORAGE\"][\"implementations\"])"'
#   → [... 'PGGraphStorage', 'PGTableGraphStorage', ...]
# 同一條指令對 v1.5.5 跑，清單裡沒有 PGTableGraphStorage。
#
# 少了一個容器、一套備份、一族「兩個資料庫要對得上」的坑。

# Postgres 在既有的 rag_default 網路上，此處只接上、不建立
networks:
  rag:
    external: true
    name: rag_default
