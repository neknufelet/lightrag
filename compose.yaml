# LightRAG 1.5.5 — 由 Dockge 管理
# 本目錄被 bind mount 進 dockge 容器的 /opt/stacks/lightrag-v1（見 /opt/stacks/dockge/compose.yaml），
# 所以原始碼留在 ghq 有版控，同時 Dockge UI 也能直接管理這個 stack。
#
# 單一實例：靠 .env 的 WORKSPACE 切換知識庫。要同時跑第二個知識庫時，
# 複製本目錄為另一個 stack，改 WORKSPACE 與 HOST_PORT 即可 —— 儲存層
# 已用 workspace 隔離，兩者可共存於同一組 Postgres/Neo4j。
#
# 注意：compose 的 ${VAR} 插值讀的是本目錄的 .env（與 env_file 同一份），
# 所以 WORKSPACE / HOST_PORT 改一處即同時生效於容器名、port 與資料路徑。

# 容器名用 ${WORKSPACE:?…} 強制插值：沒設就整個 compose 指令失敗。
#
# 為什麼要強制：容器名決定所有工具 `docker exec` 進哪裡。一個猜錯的預設
# （這裡曾是 `${WORKSPACE:-acoustics_v155}`）**不會報錯**，只會安靜地對
# 另一個庫做事。看得見的壞 > 安靜的錯。
#
# ⚠ **代價（2026-08-03 sol 終審實測，Compose v5.1.4）**：`:?` 在讀取
# compose model 時就擋下，所以 `.env` 消失且 shell 沒有 WORKSPACE 時，
# config / up / down / ps **全部** exit 1 —— 包含 **`down`**。也就是說
# 「連停都停不掉」。逃生方式：
#
#     WORKSPACE=acoustics_v2 docker compose down
#
# 這是刻意接受的取捨：緊急停機多打一個前綴，換掉「安靜連到錯的庫」。
# 但別假裝沒有這個代價 —— 真的遇到時要知道逃生指令長什麼樣。
services:
  lightrag:
    # 用 digest 而非 tag 釘死。標籤是可以被重推的 —— 作者修完 bug 常用同一個 v1.5.5
    # 再推一次，於是 compose 一個字沒改、拉到的卻是不同映像。我們整套後處理都建立在
    # 「LightRAG 如何讀寫 __parsed__ 底下的檔案」這些假設上，環境默默變動會讓假設失效
    # 而無人察覺。釘 digest 後升級變成一個明確的動作（改這一行），而非某次重啟的副作用。
    # 對應 v1.5.5。升級時用 docker image inspect --format '{{.RepoDigests}}' 取新值。
    image: ghcr.io/hkuds/lightrag@sha256:206579ab1a2bc1f2b5f19fe97c01cb801ff409e6ae29a15542f82208a285640a
    container_name: lightrag-${WORKSPACE:?WORKSPACE 未設定}
    restart: unless-stopped

    env_file: .env

    # 只綁 Tailscale 位址，不對外。要改成本機才可存取就設 BIND_ADDR=127.0.0.1
    ports:
      - "${BIND_ADDR:-100.87.88.7}:${HOST_PORT:-9621}:9621"

    volumes:
      # 執行期資料放 /data 的獨立 NVMe，不進 repo
      - ${DATA_ROOT:-/data/lightrag}/rag_storage:/app/data/rag_storage
      # inputs 必須可寫 —— LightRAG 啟動時會在其下建立 ${WORKSPACE} 子目錄。
      # 宿主因此保留 inputs/<workspace> 這一層；檔案經 WebUI／API 上傳，或見 README
      # 的批次匯入。只掛 inputs 根層，才能讓 LightRAG 建出它實際會掃的子目錄。
      - ${INPUTS_DIR:-${DATA_ROOT:-/data/lightrag}/inputs}:/app/data/inputs
      # LightRAG 的 archive_source 仍只認容器內的 __parsed__；把這個子 mount
      # 導到獨立工作區，宿主就不會把解析快取混在索引入口裡。
      - ${DATA_ROOT:-/data/lightrag}/work/parsed:/app/data/inputs/${WORKSPACE}/__parsed__

    networks:
      - rag

    # 映像檔內沒有 curl／wget，只能用 python
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - |
          import os, urllib.request as u
          u.urlopen(u.Request("http://localhost:9621/health",
                    headers={"X-API-Key": os.environ["LIGHTRAG_API_KEY"]}), timeout=5)
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # LightRAG 沒有圖片端點，1,786 張圖躺在 __parsed__/*/images/ 但 API 拿不到。
  # 這支唯讀服務把它們開出來，另外提供單篇的結構化內容。
  # 只用 Python 標準函式庫，所以直接掛官方 slim 映像跑腳本，不需要自己建映像。
  # 綁 0.0.0.0：容器內沒有 Tailscale 介面，隔離靠的是 ports 只發佈到
  # ${BIND_ADDR}，跟 lightrag 一致。
  kbapi:
    image: python:3.12-slim
    container_name: kbapi-${WORKSPACE:?WORKSPACE 未設定}
    restart: unless-stopped
    # 宿主埠走 ${KBAPI_PORT}，容器內恆為 9700（與 lightrag 的 ${HOST_PORT}:9621 同形）。
    #
    # 以下是歷史紀錄：REBUILD 期間本服務曾以 `profiles: ["kbapi"]` 停用，理由是
    # 9700 寫死、會撞到凍結中的 kbapi-acoustics_v155。但 profile 是**寫在檔案裡**的，
    # 而 compose.yaml 進版控、被兩個 checkout 共用 —— 分支一合併回主線，主線的
    # checkout 也會拿到那一行，下次 `docker compose up -d` 就不會起 kbapi，:9700
    # 靜靜消失、三個 skill 一起啞掉且不報錯。埠參數化把「哪個 checkout 用哪個埠」
    # 移到各自的 .env（不進版控），檔案本身對兩邊都正確。
    #
    # 容器名是 kbapi-${WORKSPACE}，兩個 workspace 不同名，只有埠需要錯開。
    # CUTOVER 時 v155 的 kbapi 退役、9700 空出來，把新庫 .env 的 KBAPI_PORT 改成
    # 9700 即可，compose.yaml 一個字都不用動。
    command: ["python", "/app/scripts/kbapi.py", "--port", "9700"]
    working_dir: /app
    environment:
      PP_DATA_ROOT: /data/lightrag
    volumes:
      - ./scripts:/app/scripts:ro
      - ./.env:/app/.env:ro
      - ${DATA_ROOT:-/data/lightrag}:/data/lightrag:ro
    ports:
      - "${BIND_ADDR:-100.87.88.7}:${KBAPI_PORT:-9700}:9700"
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request as u; u.urlopen('http://localhost:9700/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - rag

  # 收件匣／審核台：只用標準函式庫，直接以官方 Python slim 執行。
  # DATA_ROOT 必須可寫，因為 intake 會建立 library、work、inputs 與 intake 狀態；
  # 來源庫是別人的語料，只讀掛載，避免審核台誤寫來源。
  # ── 審核台（:9710）**不在這裡** ────────────────────────────────────────
  #
  # 這裡原本有一份 intake 服務宣告，從落地到 2026-08-04 從來沒被啟用過 ——
  # 實際跑的一直是宿主上的行程。理由寫在這裡，免得下一個人再試一次：
  #
  #   審核台會呼叫 postprocess.py，而 pp/oracle.py 靠 `docker exec` 進 LightRAG
  #   容器問它的真實行為（鐵則 3）。容器裡要做這件事就得掛 /var/run/docker.sock，
  #   而審核台是**對外開埠、接受檔案上傳**的網頁服務 —— 給它 docker socket
  #   等於誰打進來誰就有整台機器。這個交換划不來。
  #
  # 那份宣告還有兩個實質錯誤，留著就是陷阱：缺 `--source`（收件匣掃不到、
  # 畫面永遠空的），以及掛著 DeepTutor 時代的 /data/rag/knowledge_bases。
  # 有人 `docker compose up` 就會起一個搶 9710 埠的壞掉版本。
  #
  # 真正要解決的是「重開機會不會自己回來」，那是 systemd 的事：
  # `deploy/systemd/lightrag-intake.service`，用
  # `sudo scripts/systemd-units.py install` 安裝，daily-check 每天比對它還在不在。

  # ── 自己的儲存後端（2026-08-03 從 DeepTutor 的實例搬出來）──────────────
  #
  # 為什麼要搬：原本我們的資料寄住在 deeptutor-v4-postgres 與 deeptutor-v4-neo4j，
  # 靠 Postgres 的 workspace 欄位與 Neo4j 的 label 與別人的資料分開。那個安排讓
  # **同一族的 bug 咬過三次**，而且每一次都不報錯：
  #   ① extract-check.py 三句 SQL 漏 workspace 條件 → 兩個庫的同一份文件被併成
  #      一列，數字看起來完全正常（約兩倍），翻轉了三份文件的閘門判定
  #   ② CLAUDE.md 記載的關係數 20,873 —— 上面那個 bug 的殘留，活過了修它的修復
  #   ③ kbapi 的 search 不看 URL 的 workspace → 靜靜回別的庫的答案
  # 有了自己的實例，「查到別的庫」在結構上不可能 —— 因為沒有別的庫。
  #
  # 附帶好處：備份從「怎麼只挑出我們那 688 MB」變成「抄 /data/lightrag 一個目錄」。
  # 共用時做不到這件事：Postgres 的 base/<oid> 雖然一庫一目錄，但 global／pg_xact／
  # pg_wal 是全叢集共用的，只抄我們那個目錄還原不回來（沒有 global 就不知道那個
  # 目錄是哪個庫；pg_xact 對不上會讓資料列被判成「交易沒成功」而憑空消失）。
  #
  # 兩個都**不對外開埠**：同在 rag_default 網路上，用容器名互連就好，
  # 少一個對外攻擊面、也不會跟既有的埠打架。
  postgres:
    image: pgvector/pgvector:pg16          # 與原實例同版：PG 16.14 + pgvector 0.8.2
    container_name: lightrag-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DATABASE}
      TZ: Asia/Taipei
    volumes:
      - ${LIGHTRAG_DB_ROOT:-/data/lightrag}/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DATABASE}"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - rag

  # ⚠ 2026-08-07：這個服務要在重建時整個移除（見 docs/decisions/0004）。
  # 容器已刪，但定義留著 —— 因為 PGTableGraphStorage 的環境變數名還沒查證，
  # 現在拿掉會變成「沒有圖儲存」。確認之後把 LIGHTRAG_GRAPH_STORAGE 換掉、
  # 刪這一段、刪 .env 的四個 NEO4J_* 鍵、改 backup-cold.sh 的 DBS 陣列。
  neo4j:
    image: neo4j:5                          # 與原實例同版：5.26.26 community
    container_name: lightrag-neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: ${NEO4J_USERNAME}/${NEO4J_PASSWORD}
      NEO4J_PLUGINS: '["apoc"]'
      TZ: Asia/Taipei
    volumes:
      - ${LIGHTRAG_DB_ROOT:-/data/lightrag}/neo4j:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - rag

# Postgres 與 Neo4j 都在既有的 rag_default 網路上，此處只接上、不建立
networks:
  rag:
    external: true
    name: rag_default
