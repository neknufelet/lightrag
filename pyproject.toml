# lightrag 的相依鎖定 —— 2026-08-17 導入。
#
# **在此之前沒有這個檔，而那是對的。** 全部腳本一共 import 45 個模組，其中
# 43 個是標準函式庫；真正外面來的只有 `yaml` 一個，dker 上 apt 早就裝好了。
# 一個套件不值得一整套依賴管理。
#
# **改變的是切章工具搬進來**（`scripts/chapters/`）：它要 PyMuPDF —— 一個帶
# C 程式的大套件，而且版本會咬人。實測 coder 的系統 python 是 1.27.2、
# dker 的 apt 只到 1.23.7。**「我在 coder 上驗過了」正是這個 repo 一再避開的
# 那句話**（CLAUDE.md：凡是關於跑著的系統的陳述一律附 dker 的實跑輸出），
# 而版本漂移會讓那句話在無聲中變成假的。
#
# ⚠ **不宣告 `lightrag` 自己。** `parse-only.py` 與 `pp/apply.py` 匯入的
# `lightrag.parser.external.mineru` 只存在**容器裡**（dker 的系統 python
# 實測 `ModuleNotFoundError`），那幾支是走 `docker exec` 跑的。把它寫進來
# 會讓 uv 去 PyPI 抓一個同名但不是這個東西的套件。
#
# **執行期不需要 uv。** `uv sync` 產生 `.venv/`，之後 systemd 與 shell 腳本
# 直接叫 `.venv/bin/python`。dker 只在部署時用到 uv，跑的時候不用 —— 服務
# 啟動不依賴一個會上網的工具。
[project]
name = "lightrag-acoustics"
version = "0"
description = "聲學知識庫的工具腳本（不是套件，不發佈）"
requires-python = ">=3.12"
dependencies = [
    # deploy-stack.py 讀 compose.yaml 用。dker 的 apt 版是 6.0.1。
    "pyyaml>=6.0",
    # 切章工具開 PDF、取目錄、寫子檔用（`import fitz`）。
    "pymupdf>=1.24",
]

[dependency-groups]
dev = [
    # `run-tests.sh` 的兩個入口都要它（`test_gates.py` 不需要，但 pytest 收集
    # 不到它，所以那支是另外跑的）。
    "pytest>=8.0",
    # pre-commit 掛的 linter。設定在 ruff.toml，不在這裡。
    "ruff>=0.14",
]

# 這個 repo 是一堆腳本，不是可安裝的套件 —— 沒有 `import lightrag_acoustics`
# 這種用法。宣告 false，uv 就只建環境、不試著 build 它。
[tool.uv]
package = false

# ── pytest 的自訂記號 ────────────────────────────────────────────────────────
# `proves_red` 標在測試上，意思是「這條測試證明了某盞燈**會紅**」。
# 名冊與守門在 `scripts/lamps.py` 與 `tests/test_lamp_coverage.py`。
#
# **為什麼要有這個記號。** 近 30 天有 17 次修補是同一個形狀：一盞燈說了假話，
# 而說的假話是「綠」，所以沒有人發現。每一次都只修一盞。這個記號修的是類別 ——
# 加一盞新燈卻沒附「證明它會紅」的測試，`test_lamp_coverage` 會當場擋下來。
[tool.pytest.ini_options]
# ⚠ **證明必須執行「發訊號的那一支」，不是分類器。** 每盞燈是一條鏈：
#     producer 發 rc → daily-check.sh 接住 → check-levels.py 分類
#                    → latest.json → 審核台橫幅
# 而那 17 次事故**每一環都出過**（d9c5373 在 producer、5de6735 在 shell、
# 6af2c80 在分類、48efe50 在橫幅）。把 `proves_red("daily:fresh")` 標在
# 「`level_of("fresh",2)==BLOCK`」那種測試上，守門會滿足 —— 但那只證明了
# 分類器，**沒有證明 `deploy-stack.py freshness` 真的會發 2**。
#
# ⚠ **pytest 證明的是「源碼能紅」，不是「跑著的系統會紅」。** `4a6e533`
# 把基準清成 `{}` 是**資料操作**，當天任何 pytest 都照樣全綠。
# 那一族靠 `check-levels.py` 的「綠燈必須帶分母」擋（見 level_of）。
markers = [
    "proves_red(lamp_id): 這條測試證明了 lamp_id 那盞燈會紅。必須真的呼叫發訊號的那一支，不是只驗分類器（見 scripts/lamps.py 與 tests/lamp-unproven.json 的 _how_to_shrink）",
]
