# 試驗用的第二個 LightRAG：**同樣的一切，只有 LLM 端點換成遠端 vLLM。**
#
# 目的：在不碰正式庫的前提下，從頭跑一次完整流程，看 vLLM + FP8 抽出來的圖譜
# 跟本機 llama.cpp + IQ4_XS 差多少。**光比吞吐不夠——要比抽出來的東西。**
#
# 隔離靠三樣，缺一不可：
#
#   WORKSPACE        新的 workspace ⇒ Postgres 裡另一組資料，不會污染 acoustics_v2
#   HOST_PORT        另一個埠，兩個實例同時活著
#   RAG_STORAGE_DIR  ⚠ **這個最容易漏。** 裡面是 scan_spool（掃描佇列），
#                    共用會讓一邊撿到另一邊的掃描工作 —— 而且不會報錯，
#                    只會是「文件進到錯的庫」（主 compose.yaml:71 記著這條）
#
# **共用的**：postgres、infinity（embedding 與 rerank）、以及 work/parsed 的解析
# 成果。共用解析成果是刻意的 —— 那一段完全相同，重抓只是浪費 MinerU 的錢，
# 而且會讓「差異來自哪裡」多一個變數。
#
# 用法（在 dker 上）：
#     cd /opt/stacks/lightrag-vllm && docker compose up -d
#
# ⚠ `.env` 不在 repo 裡。做法是複製正式的那份再覆蓋幾個鍵，見同目錄 README。

services:
  lightrag-trial:
    # ⚠ **與正式實例同一個 digest。** 換了就多一個變數，比對就不成立了。
    image: ghcr.io/hkuds/lightrag@sha256:ab23a9c83a735901b18c8960b6b482b602d5b6291abb7e07c5776f7bb2da504e
    container_name: lightrag-${WORKSPACE:?WORKSPACE 未設定}
    restart: unless-stopped

    env_file: .env

    ports:
      - "${BIND_ADDR:-100.87.88.7}:${HOST_PORT:?HOST_PORT 未設定}:9621"

    volumes:
      # ⚠ 一定要跟正式的分開，否則兩邊搶同一個掃描佇列
      - ${RAG_STORAGE_DIR:?RAG_STORAGE_DIR 未設定}:/app/data/rag_storage
      - ${INPUTS_DIR:-${DATA_ROOT:-/data/lightrag}/inputs}:/app/data/inputs
      # 解析成果共用：那一段兩邊完全一樣，重跑只會多一個變數
      - ${DATA_ROOT:-/data/lightrag}/work/parsed:/app/data/inputs/${WORKSPACE}/__parsed__
      # 抽取規則也共用 —— **比的是模型與後端，不是規則**
      - ${REPO_DIR:?REPO_DIR 未設定}/prompts:/app/prompts:ro

    networks:
      - rag

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - |
          import os, urllib.request as u
          u.urlopen(u.Request("http://localhost:9621/health",
                    headers={"X-API-Key": os.environ["LIGHTRAG_API_KEY"]}), timeout=5)
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

networks:
  # 用正式 stack 已經建好的那張網，才連得到 postgres 與 infinity
  rag:
    external: true
    name: rag_default
