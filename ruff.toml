# ruff：掛在 pre-commit 上，守藍桶 3–8 裡機器守得住的那幾條。
#
# **為什麼要有這個檔**：沒有設定檔時 ruff 用預設規則集，對這份碼會噴 1119 個
# RUF001（把中文全形標點當「有歧義的 Unicode」）與 342 個 E501。那不是訊號是雜訊，
# 而每次 commit 都要人去分辨雜訊，會讓人開始用 --no-verify —— 那比沒有檢查更糟。
#
# 選規則的判準只有一條：**這條規則抓到的東西，是不是真的該修。**
# 不是「上游推薦」也不是「越多越好」。

target-version = "py312"
line-length = 100

# verdicts/ 是一次性的分析記錄，不是會被維護的程式碼。對它套規則只會製造
# 「改了但沒人會再讀」的工作。
exclude = ["verdicts", "**/__pycache__"]

[lint]
select = [
  "E4", "E7", "E9",  # pycodestyle 的真錯誤（**不含 E501 行長**，見下）
  "E402",            # import 不在檔案頂端 —— 本碼庫刻意違反並用 noqa 標註，
                     # 選它才能讓那些 noqa 保持有意義（不選的話 RUF100 會說它們多餘）
  "F",               # pyflakes：未使用的匯入、未定義的名字
  "I",               # import 排序
  "UP",              # 過時的寫法
  "B",               # bugbear：可變預設值、except 吞例外那類真陷阱
  "SIM",             # 明顯可簡化的分支
  "PTH",             # 藍桶 7：路徑用 pathlib 不用 os.path 字串拼接
  "PLW1510",         # subprocess.run 沒寫 check —— 靜默失敗的常見來源
  "RUF",             # ruff 自家規則（RUF001-003 在下面關掉）
]

ignore = [
  # ── 這三條把中文標點當「有歧義的 Unicode」，對一份全中文註解的碼庫是純雜訊 ──
  "RUF001", "RUF002", "RUF003",
  # ── RUF100（多餘的 noqa）不啟用 ──
  # 本碼庫有 83 個 `# noqa`：54 個 E402、26 個 **BLE001**、3 個 N802。
  # 在目前這組規則下 ruff 認為它們多餘，`--fix` 會全部拔掉。
  # 但那 26 個 BLE001 標的是「這個 blind except 是刻意的」——那是**意圖的記錄**，
  # 不是 lint 殘渣。把它們當雜訊清掉，等於無聲丟掉 26 處判斷（藍桶 2）。
  # 代價只是幾行沒作用的註解，遠低於丟掉意圖。
  "RUF100",
  # ── E501 行長不進 pre-commit ──
  # 342 處違反，而其中多數是中文說明：ruff 按碼點數，中文在畫面上佔兩格，
  # 所以「100 字元」對中英混排本來就不是一致的標準。要求對齊只會逼人把有價值的
  # 說明拆碎。line-length 仍設 100 讓 formatter 有依據，但不當成錯誤。
  "E501",
]

[lint.per-file-ignores]
# 測試裡 assert 就是判準本身，B011（assert False）不適用。
"tests/*" = ["B011"]

# `severity()` 是一張對齊的判準表：五行 `if 條件: return 等級`，靠對齊讓人一眼
# 看完整個梯度。拆成十行會失去那個一眼 —— 這裡的可讀性來自版面，不是行數。
"scripts/parse-check.py" = ["E701"]

# ── 沒有啟用、但確實對應藍桶的兩組（2026-08-08 量過，記下來免得下次重量）──
#
#   ANN（藍桶 3 型別註解）      139 處
#   T20（藍桶 4 不用 print）    336 處
#
# T20 不啟用的理由不只是量：**這些腳本是 CLI，print 就是它們的輸出**，不是拿
# print 當 log。藍桶 4 管的是後者。要守前者得先分出「哪些檔是入口」，那是另一件事。
# ANN 是純量的問題，可以分批清完再開。兩者都記在 docs/NEXT.md。
