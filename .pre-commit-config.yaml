# .pre-commit-config.yaml — 標準模板 (STANDARDS v2026.05.01) ＋ 本專案自訂
#
# P7 啟用節奏（勿改變此順序）：
#   Phase 1 (現在): 只啟用 commit-msg → 強制 Conventional Commits 格式
#   Phase 2 (視情況): 解除 ruff 註解 → 加 Python 格式化
#   Phase 3 (視情況): 解除 gitleaks 註解 → 加 secret 掃描
#
# 安裝（兩種 hook type 都要，缺一個那半邊就靜靜不跑）:
#   uvx pre-commit install --hook-type commit-msg
#   uvx pre-commit install
# 手動跑: uvx pre-commit run --hook-stage commit-msg --all-files
#         uvx pre-commit run --all-files

repos:
  # ============================================================
  # Phase 1: commit-msg 格式驗證 (Conventional Commits)
  # ============================================================
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.0.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args:
          - feat
          - fix
          - docs
          - chore
          - refactor
          - test
          - perf
          - ci
          - wip   # 允許 session-end wip commits

  # ============================================================
  # 本專案自訂：文件紀律（LOG 不落後、NEXT 不堆積）
  # ============================================================
  #
  # 兩支合起來才是完整的一圈：一支逼你把做完的事記進 LOG，
  # 一支逼你把 NEXT 裡的殘骸掃掉。只有前者的話 NEXT 會越來越肥，
  # 只有後者的話掃掉的東西沒有去處。
  #
  # 為什麼接在這裡而不是排程：這條規則的執行者原本是 dker 上的
  # lightrag-daily-check.timer → run-tests.sh → pytest。2026-08-07 實測
  # `systemctl list-timers --all` 只剩 apt-daily 兩個，單元檔還躺在
  # /etc/systemd/system 但沒有一個在跑 —— 也就是那條規則今天沒有任何執行者。
  #
  # 接在 pre-commit 上有三個好處：不依賴任何機器開著、不依賴排程、
  # 而且「commit」本來就是「有實質進展」的定義，時機天生對齊。
  #
  # 只跑這一支（一次 git 呼叫，很快），不跑整套 —— 整套要 5 秒，
  # 每次 commit 都付會讓人開始用 --no-verify，那比沒有檢查更糟。
  - repo: local
    hooks:
      - id: doc-discipline
        name: NEXT 沒堆積、LOG 沒落後、沒有死引用
        entry: >-
          pytest tests/test_log_freshness.py tests/test_next_done_ratio.py
          tests/test_no_dead_script_refs.py -q
        # language: python ＋ additional_dependencies，不是 system ——
        # system 會用「呼叫 pre-commit 的那個 python」，而 uvx 跑起來的
        # 那個沒有 pytest（實測 `No module named pytest`）。隔離環境讓它
        # 不管被誰怎麼呼叫都一樣。
        language: python
        additional_dependencies: ["pytest"]
        stages: [pre-commit]
        pass_filenames: false
        always_run: true

  # ============================================================
  # Phase 2: Python 格式化 (解除註解後啟用)
  # ============================================================
  # - repo: https://github.com/astral-sh/ruff-pre-commit
  #   rev: v0.11.10
  #   hooks:
  #     - id: ruff
  #       args: [--fix, --quiet]
  #     - id: ruff-format
  #       args: [--quiet]

  # ============================================================
  # Phase 3: Secret 掃描 (解除註解後啟用，需先設定 .gitleaks.toml)
  # ============================================================
  # - repo: https://github.com/gitleaks/gitleaks
  #   rev: v8.21.1
  #   hooks:
  #     - id: gitleaks
